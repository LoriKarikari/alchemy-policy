name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run lint
      - run: bun test --timeout 60000
        env:
          ALCHEMY_TEST_DEV: "true"
          ARTIFACT_TOKEN: test-token
